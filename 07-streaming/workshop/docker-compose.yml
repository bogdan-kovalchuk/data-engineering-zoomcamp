services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.18
    container_name: workshop-redpanda-1
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - "1G"
      - --reserve-memory
      - "0M"
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:29092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092,OUTSIDE://localhost:9092
    ports:
      - "9092:29092"
      - "9644:9644"

  postgres:
    image: postgres:16
    container_name: workshop-postgres-1
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../setup/init_postgres.sql:/docker-entrypoint-initdb.d/init_postgres.sql

  jobmanager:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workshop-jobmanager-1
    command: jobmanager
    ports:
      - "8081:8081"
    environment:
      - JOB_MANAGER_RPC_ADDRESS=jobmanager
    volumes:
      - ./src:/opt/src
    depends_on:
      - redpanda
      - postgres

  taskmanager:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workshop-taskmanager-1
    command: taskmanager
    environment:
      - JOB_MANAGER_RPC_ADDRESS=jobmanager
      - TASK_MANAGER_NUMBER_OF_TASK_SLOTS=2
    volumes:
      - ./src:/opt/src
    depends_on:
      - jobmanager

volumes:
  postgres_data:

